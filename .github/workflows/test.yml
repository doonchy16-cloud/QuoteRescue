name: QuoteRescue verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full test suite
        run: npm test
      - name: Check JavaScript syntax
        run: for f in src/*.js; do node --check "$f"; done
